codecov:
  require_ci_to_pass: yes
  precision: 2
  round: down
  layout: "reach,diff,flags,tree"

coverage:
  precision: 2
  round: down
  range: "70...100"

comment:
  layout: "reach, diff, flags, tree, component"
  behavior: default
  require_changes: no
  require_base: no
  require_head: yes
  hide_project_coverage: no

ignore:
  - "tests"
  - "scripts"

flags:
  unittests:
    carryforward: yes

parsers:
  gcov:
    branch_detection:
      conditional: yes
      loop: yes
      method: no
      macro: no

status:
  project:
    default:
      target: 65%
      threshold: 5%
      base: auto
  patch:
    default:
      target: 70%
      threshold: null

notifiers:
  - type: gist
