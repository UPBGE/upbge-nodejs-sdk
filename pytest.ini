[pytest]
# Configuração do pytest para o projeto UPBGE Node.js SDK
testpaths = tests
python_files = test_*.py
python_classes = Test*
python_functions = test_*
# Excluir __init__.py raiz para evitar importação desnecessária de bpy
norecursedirs = . .. runtime scripts
addopts = -v --strict-markers --tb=short
markers =
    unit: testes unitarios sem dependencias externas
    integration: testes de integracao com BGE
    slow: testes que demoram tempo
    bge_required: testes que requerem BGE disponivel
